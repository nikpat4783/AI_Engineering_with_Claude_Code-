[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "R&D evidence triage agent for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.28.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
]

[tool.setuptools]
packages = ["triage", "mcp_server"]

[tool.setuptools.package-dir]
"" = "src"
mcp_server = "mcp_server"
